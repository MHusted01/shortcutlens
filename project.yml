# XcodeGen spec. Run `make generate`; the .xcodeproj is not committed.
name: ShortcutLens

options:
  bundleIdPrefix: io.github.mhusted01
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # English source strings; translations are in the .xcstrings catalogs.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"

# Only the local Core package. Remote packages are rejected by
# scripts/check-no-telemetry.sh.
packages:
  ShortcutLensCore:
    path: ShortcutLensCore

targets:
  ShortcutLens:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources/Localizable.xcstrings
      # Example shortcut packs, copied as Contents/Resources/Packs.
      - path: App/Resources/Packs
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: ShortcutLensCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ShortcutLens
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: Copyright (c) 2026 Marcus Husted. MIT License.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mhusted01.shortcutlens
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # CODE_SIGN_IDENTITY comes from Config/*.xcconfig (ad-hoc unless a
        # local development identity is set up); no Apple Developer account.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # Xcode disables the hardened runtime for ad-hoc signatures; enable it
        # together with Developer ID signing if that is added later.
        # The Accessibility API is unavailable inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO

  # Local integration testing only (`make integration`); never shipped.
  MenuFixture:
    type: application
    platform: macOS
    sources:
      - Fixtures/MenuFixture/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mhusted01.shortcutlens.menufixture
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

  # Hosted in ShortcutLens.app so the AX calls run under its Accessibility
  # permission. Signed like the app (Config/Debug.xcconfig).
  ShortcutLensIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - IntegrationTests
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - target: ShortcutLens
      - target: MenuFixture
        embed: false
      - package: ShortcutLensCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mhusted01.shortcutlens.integrationtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ShortcutLens.app/Contents/MacOS/ShortcutLens
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

schemes:
  ShortcutLens:
    build:
      targets:
        ShortcutLens: all
  ShortcutLensIntegration:
    build:
      targets:
        ShortcutLens: all
        MenuFixture: all
        ShortcutLensIntegrationTests: [test]
    test:
      config: Debug
      targets:
        - ShortcutLensIntegrationTests
