language: en-US

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*.swift"
      instructions: >-
        ShortcutLens must contain no telemetry or network code. Flag any
        networking, analytics, logging to remote services or third-party
        dependencies. Check Swift 6 concurrency correctness and keep functions
        small and readable.
    - path: "App/**/*.swift"
      instructions: >-
        This layer calls the macOS Accessibility (AX) and CoreFoundation APIs.
        Check CF ownership carefully: values from Copy/Create functions are +1
        and must be released exactly once; Get functions are not owned. Flag
        blocking AX calls on the main thread and missing messaging timeouts.
    - path: "ShortcutLensCore/Tests/**"
      instructions: >-
        Tests use Swift Testing. Check that edge cases are covered and that
        tests do not depend on the Accessibility permission.
    - path: ".github/workflows/**"
      instructions: >-
        Actions must be pinned to full commit SHAs and use least-privilege
        permissions.

chat:
  auto_reply: true
