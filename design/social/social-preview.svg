<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2350"/><stop offset="1" stop-color="#081430"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f95ff"/><stop offset="1" stop-color="#0a4bc2"/></linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde9fb"/></radialGradient>
    <g id="cmd" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="36"><path d="M-70,-70 H70 V70 H-70 Z"/><g id="loop"><path d="M70,-70 L125,-70 A55,55 0 1 0 70,-125 L70,-70"/></g><use xlink:href="#loop" transform="rotate(90)"/><use xlink:href="#loop" transform="rotate(180)"/><use xlink:href="#loop" transform="rotate(270)"/></g>
  </defs>
  <rect width="1280" height="640" fill="url(#page)"/>
  <!-- Icon master (design/icon/ShortcutLens.svg), 1024 grid scaled to 400 px -->
  <g transform="translate(80 120) scale(0.390625)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <line x1="640" y1="640" x2="800" y2="800" stroke="#13203a" stroke-width="86" stroke-linecap="round"/>
    <circle cx="462" cy="462" r="236" fill="url(#glass)" stroke="#eef4ff" stroke-width="46"/>
    <use xlink:href="#cmd" transform="translate(462 462) scale(0.86)" stroke="#0a5ad8"/>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="540" y="268" font-size="88" font-weight="bold">ShortcutLens</text>
    <text x="542" y="340" font-size="34" fill="#c9d8f5">Hold Command to see every keyboard</text>
    <text x="542" y="384" font-size="34" fill="#c9d8f5">shortcut of the app you are using.</text>
    <text x="542" y="456" font-size="26" fill="#7f9bd0">Native macOS menu bar app · offline · MIT</text>
  </g>
</svg>
